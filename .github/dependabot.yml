# .github/dependabot.yml
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pnpm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0 <11.0.0"
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0 <11.0.0"
