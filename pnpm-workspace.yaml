# Workspace-level pnpm settings for dependency resolution and install targets.
# pnpm-workspace.yaml
overrides:
  shell-quote: 1.8.4
  tmp: 0.2.7

allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  unrs-resolver: true
supportedArchitectures:
  cpu:
    - current
    - x64
  os:
    - current
    - win32
    - linux
